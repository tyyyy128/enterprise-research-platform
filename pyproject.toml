[project]
name = "enterprise-research-platform"
version = "0.1.0"
description = "Enterprise Deep Research and Knowledge Agent Platform for DeerFlow"
requires-python = ">=3.12"
dependencies = [
    "deerflow-extension-api>=0.2,<0.3",
    "fastapi>=0.115,<1",
]

[project.entry-points."deerflow.extensions"]
enterprise-research = "enterprise_research:install"

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=9,<10",
    "ruff>=0.15,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_research"]
[tool.uv.sources]
deerflow-extension-api = { path = "../deer-flow/backend/packages/extension-api", editable = true }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
